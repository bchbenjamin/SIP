spring:
  application:
    name: sip-backend
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none # Flyway manages schema, not Hibernate
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info # Only expose necessary endpoints
  health:
    probes:
      enabled: true
