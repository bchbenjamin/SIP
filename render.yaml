services:
  - name: sip-backend
    runtime: docker
    region: singapore
    plan: free
    healthCheckPath: /actuator/health
    rootDir: ""
    autoDeploy: yes
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DEVICE_API_KEY
        sync: false
      - key: MQTT_BROKER_URL
        sync: false
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false
      - key: MQTT_USE_TLS
        value: "true"
      - key: NODE_CREDENTIAL_SALT
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "https://kev-ai-device.vercel.app,https://sip.bchbenjamin.in,https://api.sip.bchbenjamin.in"
      - key: SIP_BOOTSTRAP_ADMIN_USERNAME
        value: "admin"
      - key: SIP_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: SERVER_PORT
        value: "10000"