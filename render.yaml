services:
  - name: sip-backend
    runtime: java
    region: singapore
    plan: free
    healthCheckPath: /actuator/health
    buildCommand: mkdir -p build/libs && cp sip-backend-0.1.0.jar build/libs/sip-backend-0.1.0.jar && echo "JAR copied"
    startCommand: java -XX:+UseG1GC -Xmx512m -jar build/libs/sip-backend-0.1.0.jar
    rootDir: database/backend
    autoDeploy: yes
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DEVICE_API_KEY
        sync: false
      - key: MQTT_BROKER_URL
        sync: false
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false
      - key: MQTT_USE_TLS
        value: "true"
      - key: NODE_CREDENTIAL_SALT
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "https://kev-ai-device.vercel.app"
      - key: SIP_BOOTSTRAP_ADMIN_USERNAME
        value: "admin"
      - key: SIP_BOOTSTRAP_ADMIN_PASSWORD
        sync: false