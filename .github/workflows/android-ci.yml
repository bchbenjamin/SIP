name: Android CI

on:
  push:
    branches: ["main"]
    paths:
      - "android-frontend/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "android-frontend/**"
      - ".github/workflows/android-ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build and test
        working-directory: android-frontend/android
        env:
          SIP_API_BASE_URL: "https://api.sip.bchbenjamin.in/"
          SIP_KEYSTORE_PASSWORD: "S1pGuardian2026!"
          SIP_KEY_PASSWORD: "S1pGuardian2026!"
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean testDebugUnitTest assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sip-guardian-release-apk
          path: android-frontend/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
