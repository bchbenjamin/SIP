spring:
  application:
    name: sip-backend

  datasource:
    # Provide DATABASE_URL as the raw Neon connection string, e.g.:
    #   postgresql://USER:PASSWORD@HOST/DB?sslmode=require&channel_binding=require
    # The DataSourceConfig extracts user/password from it and uses query params.
    url: jdbc:postgresql://${DB_HOST:localhost}/${DB_NAME:sipdb}?${DB_QUERY:user=sipuser&sslmode=disable}
    username: ${DB_USER:${DATABASE_USERNAME:}}
    password: ${DB_PASSWORD:${DATABASE_PASSWORD:}}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:${PORT:8080}}
  address: 0.0.0.0
  error:
    include-message: never
    include-binding-errors: never

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiry-seconds: ${JWT_ACCESS_EXPIRY:900}
    refresh-token-expiry-seconds: ${JWT_REFRESH_EXPIRY:604800}
  mqtt:
    enabled: ${MQTT_ENABLED:true}
    broker-url: ${MQTT_BROKER_URL:}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
    client-id: ${MQTT_CLIENT_ID:sip-backend}
    command-timeout: 30
    keep-alive-interval: 60
    use-tls: ${MQTT_USE_TLS:false}
  node:
    credential-salt: ${NODE_CREDENTIAL_SALT:}
  device-api-key: ${DEVICE_API_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized
