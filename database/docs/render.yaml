# Render deployment configuration for SIP Backend
# Place this file in database/backend/render.yaml
# Then: render blueprint create

services:
  - name: sip-backend
    runtime: docker
    dockerfilePath: ../Dockerfile
    region: oregon
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DEVICE_API_KEY
        sync: false
      - key: MQTT_BROKER_URL
        value: tcp://broker.hivemq.com:1883
      - key: CORS_ALLOWED_ORIGINS
        value: https://kev-ai-device.vercel.app
      - key: SIP_BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: SIP_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: JAVA_OPTS
        value: -Xmx512m -XX:+UseG1GC